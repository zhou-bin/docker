name: Download docker
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Download docker
        run: |
          docker pull ntop/ntopng:stable
          echo "$(docker images ntop/ntopng:stable --format '{{.Size}}')"
      
      - name: Export to TAR
        run: |
          mkdir -p output
          docker save ntop/ntopng:stable -o output/ntopng:stable.tar
          ls -lh output/
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ntopng:stable
          path: output/