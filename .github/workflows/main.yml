name: Download docker
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  download:
    runs-on: ubuntu-latest
    
    steps:
      - name: Download docker
        run: |
          docker pull redis:alpine
          echo "$(docker images redis:alpine --format '{{.Size}}')"
      
      - name: Export to TAR
        run: |
          mkdir -p output
          docker save redis:alpine -o output/redis-alpine.tar
          ls -lh output/
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: redis-alpine
          path: output/